name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: build (${{ matrix.mc }})
    runs-on: ubuntu-latest
    # 26.2 is new/untested and 1.21.11 is frozen/legacy, so they don't fail the whole run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.1.2',  java: 25, gradle: '9.7.1', experimental: false }
          - { mc: '26.2',    java: 25, gradle: '9.7.1', experimental: true }
          - { mc: '26.3',    java: 25, gradle: '9.7.1', experimental: false }
          - { mc: '1.21.11', java: 21, gradle: '9.2.1', experimental: true }
    defaults:
      run:
        working-directory: versions/${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: floptext-rgb-${{ matrix.mc }}
          path: |
            versions/${{ matrix.mc }}/build/libs/*.jar
            !versions/${{ matrix.mc }}/build/libs/*-sources.jar
